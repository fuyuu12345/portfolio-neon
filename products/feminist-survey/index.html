<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>女性主义文创 · 前期调研</title>
  <link rel="stylesheet" href="css/style.css" />

</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <main class="wrap">
    <div class="topbar">
      <div class="brand">Feminist Cultural Research · Demo</div>
      <div class="topbar-links">
        <span class="ghost" style="opacity:.7;pointer-events:none">作品集展示 Demo</span>
      </div>
    </div>

    <header class="hero">
      <h1 id="survey-title">女性主义文创 · 前期调研</h1>

        <div class="progress-meta">
          <span>填写进度 <span id="page-text">第 1 / 1 页</span></span>
          <span id="progress-text">0%</span>
        </div>
        <div class="progress-bar"><span id="progress-bar"></span></div>

    <form class="card" id="survey-form" novalidate>
      <div id="questions"></div>
      <div class="actions">
        <button type="button" class="btn btn-secondary" id="prev-btn" hidden>上一页</button>
        <button type="button" class="btn btn-primary" id="next-btn">下一页</button>
        <button type="submit" class="btn btn-primary" id="submit-btn" hidden>提交问卷</button>
      </div>
      <div class="status" id="status" role="status"></div>
    </form>
  </main>

  <script src="js/api-base.js?v=20260723d"></script>
