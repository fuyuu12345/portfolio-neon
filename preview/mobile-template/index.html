<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05050a" />
    <title>AFTERGLOW · 手机模板</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="mobile.css?v=12" />
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>

    <div class="banner" role="note">
      手机布局模板 · 不影响电脑版
      <a href="../index.html">回正式预览</a>
    </div>

    <div class="boot" id="boot">
      <div class="boot__sign">
        <p class="boot__eyebrow" id="bootEyebrow">赛博蜉蝣</p>
        <h1 class="boot__title">AFTERGLOW <span class="title-sep" aria-hidden="true">·</span> LORDE PORTFOLIO</h1>
        <p class="boot__welcome" id="bootWelcome">雨还在下。先推门进来。</p>
        <button type="button" class="boot__btn" id="bootEnter">推门进入</button>
      </div>
    </div>

    <main class="app" id="app" hidden>
      <header class="top">
        <div class="top__brand">
          <span class="top__eyebrow" id="brandEyebrow">赛博蜉蝣</span>
          <h1>AFTERGLOW <span class="title-sep" aria-hidden="true">·</span> LORDE PORTFOLIO</h1>
        </div>
        <div class="top__welcome-wrap">
          <button type="button" class="welcome" id="strangerBtn" aria-expanded="false">
            <span class="welcome__avatar" aria-hidden="true">
              <svg viewBox="0 0 32 32" aria-hidden="true">
                <rect x="1" y="1" width="30" height="30" fill="#1a0a28" stroke="#ff4b96" stroke-width="1"/>
                <circle cx="16" cy="12" r="5" fill="#ff9ad8"/>
                <path d="M8 28c1.5-6 5-9 8-9s6.5 3 8 9" fill="#3a2060"/>
                <rect x="11" y="11" width="10" height="3" rx="1" fill="#00f0ff" opacity=".7"/>
              </svg>
            </span>
            <span class="welcome__copy">
              <span class="welcome__hi" id="welcomeHi">欢迎，</span>
              <span class="welcome__name" id="welcomeName">陌生人</span>
            </span>
            <span class="welcome__chev" aria-hidden="true"></span>
          </button>
          <div class="welcome__menu" id="strangerMenu" hidden>
            <button type="button" id="menuLang">语言 · 中文 / EN</button>
            <button type="button" id="menuMute">静音</button>
          </div>
        </div>
      </header>

      <section class="hero" aria-label="Bar stage">
        <img
          class="hero__img"
          src="../assets/scene-bar.png?v=2"
          alt=""
          width="1280"
          height="800"
          decoding="async"
        />
        <div class="hero__shade" aria-hidden="true"></div>

        <div class="talk" id="talk">
          <div class="talk__box">
            <button type="button" class="talk__main" id="dialogueBtn">
              <span class="talk__tag">LORDE</span>
              <span class="talk__text" id="dialogueText"></span>
              <span class="talk__cue" aria-hidden="true"></span>
            </button>
            <button type="button" class="talk__back" id="storyBack" hidden>返回</button>
          </div>
          <div class="choices" id="choices" hidden></div>
        </div>
      </section>

      <nav class="dock" aria-label="导航">
        <button type="button" class="dock__btn is-on" data-nav="talk">点单</button>
        <button type="button" class="dock__btn" data-nav="work">作品</button>
        <button type="button" class="dock__btn" data-nav="exp">经历</button>
        <button type="button" class="dock__btn" data-nav="contact">联系</button>
      </nav>

      <section class="panel" id="panelNow">
        <div class="panel__head">
          <h2>NOW PLAYING</h2>
          <p>进店后自动播 · 可切歌</p>
        </div>
        <div class="now">
          <div>
            <div class="now__title" id="musicTitle">Neon Pad</div>
            <div class="now__status" id="musicStatus">等待推门</div>
          </div>
          <button type="button" class="hit" id="musicNext" aria-label="下一首">⏭</button>
        </div>
      </section>

      <section class="panel" id="panelDrinks">
        <div class="panel__head">
          <h2>今日特调</h2>
          <p>点一杯，和 Lorde 聊两句</p>
        </div>
        <div class="drinks" id="drinks"></div>
      </section>

      <section class="panel panel--cyan">
        <div class="panel__head">
          <h2>FEATURED</h2>
          <p>精选作品</p>
        </div>
        <article class="feat">
          <div class="feat__cover" id="featCover"></div>
          <div class="feat__meta">
            <h3 id="featTitle">家灯</h3>
            <p id="featSum">其ta · 小程序 Demo</p>
            <div class="feat__nav">
              <button type="button" class="hit" id="featPrev" aria-label="上一个">‹</button>
              <span class="feat__dots" id="featDots"></span>
              <button type="button" class="hit" id="featNext" aria-label="下一个">›</button>
            </div>
            <button type="button" class="btn-wide" id="featOpen">查看作品 →</button>
          </div>
        </article>
      </section>

      <footer class="foot">
        <p>© 2026 刘骅慧 / Lorde</p>
        <p class="foot__note">此页仅模板，正式站仍是 preview/index.html</p>
      </footer>
    </main>

    <!-- 底部抽屉：作品 / 经历 / 联系 -->
    <div class="sheet" id="sheet" hidden>
      <button type="button" class="sheet__scrim" id="sheetScrim" aria-label="关闭"></button>
      <div class="sheet__card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <div class="sheet__bar">
          <h2 id="sheetTitle">作品</h2>
          <button type="button" class="hit sheet__close" id="sheetClose" aria-label="关闭">×</button>
        </div>
        <div class="sheet__tabs" id="sheetTabs" hidden></div>
        <div class="sheet__body" id="sheetBody"></div>
      </div>
    </div>

    <script src="../../js/content.js?v=14"></script>
    <script src="stories.js?v=14"></script>
    <script src="mobile.js?v=14"></script>
  </body>
</html>
