<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- 01 checkered washi -->
  <symbol id="st-washi-check" viewBox="0 0 160 36">
    <rect x="2" y="6" width="156" height="22" rx="3" fill="#F2C9C4" opacity="0.85"/>
    <g fill="#fff" opacity="0.55">
      <rect x="8" y="8" width="10" height="9"/><rect x="28" y="8" width="10" height="9"/>
      <rect x="48" y="8" width="10" height="9"/><rect x="68" y="8" width="10" height="9"/>
      <rect x="88" y="8" width="10" height="9"/><rect x="108" y="8" width="10" height="9"/>
      <rect x="128" y="8" width="10" height="9"/><rect x="148" y="8" width="8" height="9"/>
      <rect x="18" y="17" width="10" height="9"/><rect x="38" y="17" width="10" height="9"/>
      <rect x="58" y="17" width="10" height="9"/><rect x="78" y="17" width="10" height="9"/>
      <rect x="98" y="17" width="10" height="9"/><rect x="118" y="17" width="10" height="9"/>
      <rect x="138" y="17" width="10" height="9"/>
    </g>
    <rect x="2" y="6" width="156" height="22" rx="3" fill="none" stroke="#E9B7B2" stroke-width="1.2"/>
  </symbol>

  <!-- 02 plain washi -->
  <symbol id="st-washi-plain" viewBox="0 0 140 30">
    <rect x="2" y="5" width="136" height="18" rx="3" fill="#E8DCCE" opacity="0.9"/>
    <rect x="2" y="5" width="136" height="18" rx="3" fill="none" stroke="#D8CBB8" stroke-width="1"/>
  </symbol>

  <!-- 03 polaroid -->
  <symbol id="st-polaroid" viewBox="0 0 100 120">
    <rect x="6" y="6" width="88" height="108" rx="3" fill="#fff" stroke="#E5DED6" stroke-width="1.5"/>
    <rect x="14" y="14" width="72" height="72" rx="1" fill="#F0E7DC"/>
  </symbol>

  <!-- 04 corners -->
  <symbol id="st-corners" viewBox="0 0 80 80">
    <path d="M8 8h18v6H14v12H8z" fill="#F2C9C4"/>
    <path d="M72 8H54v6h12v12h6z" fill="#E8DCCE"/>
    <path d="M8 72h18v-6H14V54H8z" fill="#E8DCCE"/>
    <path d="M72 72H54v-6h12V54h6z" fill="#F2C9C4"/>
  </symbol>

  <!-- 05 lamp -->
  <symbol id="st-lamp" viewBox="0 0 80 90">
    <path d="M22 70c8-12 28-12 36 0" fill="none" stroke="#D4928C" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M28 64 Q40 28 52 64" fill="#F7E3DF" stroke="#D4928C" stroke-width="2"/>
    <circle cx="40" cy="50" r="7" fill="#FFE7B8" stroke="#E2C07A" stroke-width="1.5"/>
    <path d="M40 34v-8M30 40l-5-5M50 40l5-5" stroke="#E2C07A" stroke-width="1.6" stroke-linecap="round"/>
  </symbol>

  <!-- 06 heart -->
  <symbol id="st-heart" viewBox="0 0 48 44">
    <path d="M24 38 C10 28 4 20 4 13 A9 9 0 0 1 24 10 A9 9 0 0 1 44 13 C44 20 38 28 24 38Z"
      fill="#F0C6C2" stroke="#D4928C" stroke-width="1.6"/>
  </symbol>

  <!-- 07 dashed frame -->
  <symbol id="st-dash-frame" viewBox="0 0 160 100">
    <rect x="6" y="6" width="148" height="88" rx="14" fill="none" stroke="#B7AFA8"
      stroke-width="2" stroke-dasharray="5 5"/>
  </symbol>

  <!-- 08 sticky note -->
  <symbol id="st-note" viewBox="0 0 90 90">
    <path d="M8 6h70a4 4 0 0 1 4 4v66a4 4 0 0 1-4 4H12a4 4 0 0 1-4-4V10a4 4 0 0 1 4-4z"
      fill="#F7E0DC" stroke="#E9B7B2" stroke-width="1.4"/>
    <path d="M66 6l12 12H70a4 4 0 0 1-4-4V6z" fill="#F0C6C2"/>
  </symbol>

  <!-- 09 paperclip -->
  <symbol id="st-clip" viewBox="0 0 40 70">
    <path d="M14 18v28a6 6 0 0 0 12 0V22a4 4 0 0 0-8 0v22"
      fill="none" stroke="#9BB4C0" stroke-width="3.2" stroke-linecap="round"/>
  </symbol>

  <!-- 10 stars flower -->
  <symbol id="st-sparkle" viewBox="0 0 90 70">
    <path d="M20 28l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#C5D2C0" stroke="#9BB394" stroke-width="1"/>
    <path d="M58 16l2.5 6.5 6.5 2.5-6.5 2.5L58 34l-2.5-6.5L49 25l6.5-2.5z" fill="#F0C6C2" stroke="#D4928C" stroke-width="1"/>
    <circle cx="70" cy="48" r="7" fill="#F7E3DF" stroke="#E9B7B2" stroke-width="1.2"/>
    <circle cx="70" cy="48" r="2.5" fill="#D4928C"/>
    <path d="M70 38v4M70 54v4M60 48h4M76 48h4" stroke="#C5D2C0" stroke-width="1.3" stroke-linecap="round"/>
  </symbol>

  <!-- 11 envelope -->
  <symbol id="st-envelope" viewBox="0 0 90 70">
    <rect x="10" y="18" width="70" height="42" rx="4" fill="#F7E3DF" stroke="#D4928C" stroke-width="1.8"/>
    <path d="M10 22l35 22 35-22" fill="none" stroke="#D4928C" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M18 14h40l8 10H26z" fill="#E9B7B2" stroke="#D4928C" stroke-width="1.4"/>
  </symbol>

  <!-- 12 today label -->
  <symbol id="st-today" viewBox="0 0 86 40">
    <rect x="4" y="6" width="78" height="28" rx="14" fill="#F0C6C2" stroke="#D4928C" stroke-width="1.4"/>
    <text x="43" y="25" text-anchor="middle" font-size="14" font-family="ZCOOL XiaoWei, serif" fill="#2F2A28">??</text>
  </symbol>
</svg>
