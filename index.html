<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07060a" />
    <title>AFTERGLOW · 选择阅读方式</title>
    <link rel="preload" href="preview/assets/fonts/PressStart2P-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="preview/assets/fonts/Cubic_11.ttf" as="font" type="font/ttf" crossorigin />
    <style>
      @font-face {
        font-family: "Press Start 2P";
        src: url("preview/assets/fonts/PressStart2P-Regular.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Cubic 11";
        src: url("preview/assets/fonts/Cubic_11.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }

      :root {
        --bg: #07060a;
        --panel: #100e16;
        --ink: #f4eef8;
        --mute: #9b92a8;
        --pink: #ff4b96;
        --cyan: #7af0f7;
        --line: rgba(255, 75, 150, 0.55);
        --pixel: "Press Start 2P", "Cubic 11", monospace;
        --cn: "Cubic 11", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: var(--cn);
        color: var(--ink);
        background:
          radial-gradient(ellipse 70% 40% at 10% 0%, rgba(255, 75, 150, 0.12), transparent 55%),
          var(--bg);
        min-height: 100dvh;
        display: flex;
        align-items: stretch;
        justify-content: center;
        padding:
          max(10px, env(safe-area-inset-top))
          14px
          max(10px, env(safe-area-inset-bottom));
        -webkit-font-smoothing: none;
        font-smooth: never;
      }

      .wrap {
        width: min(520px, 100%);
        min-height: 0;
        max-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 8px;
        padding: 4px 0;
      }

      .eyebrow {
        margin: 0;
        font-size: 13px;
        letter-spacing: 0.12em;
        color: var(--cyan);
        line-height: 1.3;
      }

      .eyebrow .en {
        font-family: var(--pixel);
        font-size: 0.5rem;
        letter-spacing: 0.04em;
        vertical-align: 0.08em;
      }

      .brand {
        margin: 0;
        font-family: var(--pixel);
        font-size: clamp(0.92rem, 4.2vw, 1.2rem);
        line-height: 1.35;
        letter-spacing: 0.02em;
      }

      .brand .w { color: var(--ink); }
      .brand .p { color: var(--pink); }

      .lead {
        margin: 0 0 2px;
        font-size: 12px;
        line-height: 1.45;
        letter-spacing: 0.03em;
        color: var(--mute);
      }

      .choices {
        display: grid;
        gap: 8px;
        flex: 0 0 auto;
      }

      .choice {
        display: grid;
        grid-template-columns: 1fr auto;
        grid-template-rows: auto auto;
        column-gap: 10px;
        row-gap: 2px;
        align-items: center;
        text-decoration: none;
        color: inherit;
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 10px 12px;
        transition: border-color 0.18s ease, background 0.18s ease;
      }

      .choice:active { transform: scale(0.99); }
      .choice:hover {
        border-color: var(--pink);
        background: #14101c;
      }

      .choice__kicker {
        margin: 0;
        grid-column: 1;
        font-family: var(--pixel);
        font-size: 0.48rem;
        line-height: 1.3;
        letter-spacing: 0.06em;
        color: var(--cyan);
      }

      .choice h2 {
        margin: 0;
        grid-column: 1;
        font-family: var(--cn);
        font-size: 15px;
        font-weight: 400;
        letter-spacing: 0.06em;
        color: var(--ink);
        line-height: 1.3;
      }

      .choice p { display: none; }

      .choice__go {
        grid-column: 2;
        grid-row: 1 / span 2;
        font-size: 12px;
        letter-spacing: 0.06em;
        color: var(--pink);
        white-space: nowrap;
      }

      .echo {
        margin: 2px 0 0;
        padding-top: 8px;
        border-top: 1px solid rgba(244, 238, 248, 0.12);
        flex: 0 1 auto;
        min-height: 0;
      }

      .echo__top {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 8px;
        margin: 0 0 6px;
      }

      .echo__title {
        margin: 0;
        font-size: 13px;
        font-weight: 400;
        letter-spacing: 0.06em;
      }

      .echo__tags {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }

      .echo__tags span {
        border: 1px solid rgba(122, 240, 247, 0.4);
        padding: 2px 6px;
        font-size: 11px;
        letter-spacing: 0.04em;
        color: var(--cyan);
      }

      .echo__copy {
        margin: 0 0 6px;
        font-size: 11px;
        line-height: 1.45;
        letter-spacing: 0.02em;
        color: var(--mute);
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 3;
        overflow: hidden;
      }

      .echo__row {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 8px 14px;
      }

      .echo__cta {
        margin: 0;
        font-size: 12px;
        letter-spacing: 0.08em;
        color: var(--pink);
      }

      .echo a {
        color: var(--cyan);
        text-decoration: none;
        font-size: 12px;
        letter-spacing: 0.04em;
      }

      .echo a:hover { color: var(--pink); }

      @media (min-height: 740px) {
        .wrap { gap: 10px; }
        .lead { font-size: 13px; }
        .choice { padding: 12px 14px; }
        .choice h2 { font-size: 16px; }
        .choice p {
          display: block;
          margin: 0;
          grid-column: 1 / -1;
          font-size: 12px;
          line-height: 1.4;
          color: var(--mute);
        }
        .choice__go {
          grid-row: 1 / span 2;
        }
        .echo__copy {
          font-size: 12px;
          -webkit-line-clamp: 4;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <p class="eyebrow">赛博蜉蝣 · <span class="en">AFTERGLOW</span></p>
      <h1 class="brand"><span class="w">LORDE</span> <span class="p">PORTFOLIO</span></h1>
      <p class="lead">选一种阅读方式：电脑横屏，或手机竖屏。</p>

      <div class="choices">
        <a class="choice" href="preview/index.html?desktop=1">
          <p class="choice__kicker">DESKTOP</p>
          <h2>电脑版 · 横屏</h2>
          <p>对话、作品墙与宽屏叙事。</p>
          <span class="choice__go">打开 →</span>
        </a>
        <a class="choice" href="preview/mobile/index.html">
          <p class="choice__kicker">PHONE</p>
          <h2>手机版 · 竖屏</h2>
          <p>触控优先，方便滑动查看。</p>
          <span class="choice__go">打开 →</span>
        </a>
      </div>

      <section class="echo" aria-label="产品案 ECHO">
        <div class="echo__top">
          <h2 class="echo__title">产品案 · ECHO</h2>
          <div class="echo__tags">
            <span>具身智能</span>
            <span>可穿戴</span>
          </div>
        </div>
        <p class="echo__copy">
          2026 北京 Shenicest · 萨福命题。4 天软硬件可演示闭环（已进入专利申请流程）。萨福社媒多次发布；已与品牌产品侧建联。
        </p>
        <div class="echo__row">
          <p class="echo__cta">开放合作 / 建联</p>
          <a href="products/echo-yesido/">进入 ECHO →</a>
        </div>
      </section>
    </main>
  </body>
</html>
